<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forzes Stream</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap');

        :root {
            --pc-font-size-title: 4em;
            --mobile-font-size-title: 2.5em;
            --pc-avatar-size: 180px;
            --mobile-avatar-size: 140px;
            --pc-button-width: 300px;
            --mobile-button-width: 90%;
            --pc-padding: 40px 20px;
            --mobile-padding: 20px 15px;
            --pc-gap: 20px;
            --mobile-gap: 15px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(255, 0, 150, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(0, 255, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* ========== ОБЩИЕ СТИЛИ ========== */
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
        }

        header {
            text-align: center;
            padding: var(--pc-padding);
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            margin-bottom: 40px;
        }

        .nickname {
            font-size: var(--pc-font-size-title);
            margin: 0 0 20px 0;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            color: #ffffff;
            animation: glow 2s ease-in-out infinite alternate;
            font-weight: 900;
        }

        .avatar {
            width: var(--pc-avatar-size);
            height: var(--pc-avatar-size);
            border-radius: 50%;
            background: url('assets/32PbU5bsSkOMI561TWeQfg@2k.webp') center/cover no-repeat;
            margin: 0 auto;
            border: 3px solid #00ffff;
            box-shadow: 0 0 20px #00ffff;
            animation: avatarPulse 3s ease-in-out infinite;
        }

        /* ========== КНОПКИ В СТОЛБИК ========== */
        .links-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--pc-gap);
            width: 100%;
            padding: 0 20px;
            margin-bottom: 40px;
        }

        /* Общие стили кнопок */
        .link-btn {
            color: #fff;
            padding: 18px 40px;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.2em;
            transition: all 0.3s ease;
            border: 2px solid;
            text-align: center;
            font-weight: 700;
            position: relative;
            overflow: hidden;
            z-index: 1;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-height: 60px;
            width: var(--pc-button-width);
            max-width: 100%;
            margin: 0 auto;
        }

        /* Иконки для кнопок */
        .link-btn::before {
            font-size: 1.3em;
            min-width: 30px;
            text-align: center;
        }

        /* Стили кнопок по типу */
        .vk {
            background: linear-gradient(45deg, #4c75a3, #5b86b5, #6a97c7);
            border-color: #4c75a3;
        }
        .vk::before { content: '👤'; }

        .telegram {
            background: linear-gradient(45deg, #0088cc, #0099dd, #00aaff);
            border-color: #0088cc;
        }
        .telegram::before { content: '✈️'; }

        .youtube {
            background: linear-gradient(45deg, #ff0000, #cc0000, #ff3333);
            border-color: #ff0000;
        }
        .youtube::before { content: '▶'; }

        .discord {
            background: linear-gradient(45deg, #5865f2, #677bc4, #7889d6);
            border-color: #5865f2;
        }
        .discord::before { content: '💬'; }

        .donate-btn {
            background: linear-gradient(45deg, #ff8c00, #ffa500, #ffcc00);
            border-color: #ff8c00;
        }
        .donate-btn::before { content: '💰'; }

        .memes-btn {
            background: linear-gradient(45deg, #ff00ff, #ff00cc, #ff0099);
            border-color: #ff00ff;
        }
        .memes-btn::before { content: '😂'; }

        .game-site-btn {
            background: linear-gradient(45deg, #00ff00, #00cc00, #00aa00);
            border-color: #00ff00;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9em;
        }
        .game-site-btn::before { content: '🎮'; }

        /* Эффекты при наведении (только для ПК) */
        @media (hover: hover) {
            .link-btn:hover {
                transform: translateY(-5px) scale(1.05);
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
                filter: brightness(1.2);
                letter-spacing: 2px;
            }
        }

        /* Анимации */
        @keyframes glow {
            from { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; }
            to { text-shadow: 0 0 30px #ff00ff, 0 0 60px #ff00ff; }
        }

        @keyframes avatarPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px #00ffff; }
            50% { transform: scale(1.05); box-shadow: 0 0 30px #00ffff; }
        }

        @keyframes buttonFadeIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Анимация появления кнопок */
        .link-btn {
            animation: buttonFadeIn 0.6s ease-out forwards;
            opacity: 0;
        }

        .link-btn:nth-child(1) { animation-delay: 0.1s; }
        .link-btn:nth-child(2) { animation-delay: 0.2s; }
        .link-btn:nth-child(3) { animation-delay: 0.3s; }
        .link-btn:nth-child(4) { animation-delay: 0.4s; }
        .link-btn:nth-child(5) { animation-delay: 0.5s; }
        .link-btn:nth-child(6) { animation-delay: 0.6s; }
        .link-btn:nth-child(7) { animation-delay: 0.7s; }

        /* ========== МОБИЛЬНАЯ ВЕРСИЯ ========== */
        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
                max-width: 100%;
            }

            header {
                padding: var(--mobile-padding);
                margin-bottom: 30px;
                background: rgba(0, 0, 0, 0.9);
                position: sticky;
                top: 0;
                z-index: 100;
                backdrop-filter: blur(10px);
            }

            .nickname {
                font-size: var(--mobile-font-size-title);
                text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff;
                margin-bottom: 15px;
            }

            .avatar {
                width: var(--mobile-avatar-size);
                height: var(--mobile-avatar-size);
                border: 2px solid #00ffff;
                box-shadow: 0 0 15px #00ffff;
            }

            /* Кнопки для мобильных */
            .links-column {
                gap: var(--mobile-gap);
                padding: 0 15px;
            }

            .link-btn {
                width: var(--mobile-button-width);
                max-width: 400px;
                padding: 16px 25px;
                font-size: 1.1em;
                min-height: 55px;
                border-radius: 15px;
                margin: 0 auto;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            }

            .link-btn::before {
                font-size: 1.4em;
                min-width: 35px;
            }

            /* Увеличиваем область касания */
            .link-btn:active {
                transform: scale(0.98);
                transition: transform 0.1s;
            }

            /* Оптимизация для планшетов */
            @media (min-width: 481px) and (max-width: 768px) {
                .link-btn {
                    width: 80%;
                    max-width: 350px;
                    padding: 20px 35px;
                    font-size: 1.3em;
                }
            }

            /* Ландшафтная ориентация */
            @media (orientation: landscape) and (max-height: 500px) {
                header {
                    padding: 10px 15px;
                    margin-bottom: 20px;
                }
                
                .avatar {
                    width: 100px;
                    height: 100px;
                    margin: 10px auto;
                }
                
                .links-column {
                    gap: 10px;
                    padding: 10px;
                }
                
                .link-btn {
                    padding: 12px 20px;
                    min-height: 45px;
                }
                
                .nickname {
                    font-size: 2em;
                    margin-bottom: 10px;
                }
            }
        }

        /* ========== ПК ВЕРСИЯ (большие экраны) ========== */
        @media (min-width: 1400px) {
            .container {
                max-width: 1000px;
            }
            
            .link-btn {
                width: 350px;
                padding: 22px 50px;
                font-size: 1.3em;
            }
            
            .nickname {
                font-size: 5em;
            }
            
            .avatar {
                width: 220px;
                height: 220px;
            }
        }

        footer {
            text-align: center;
            padding: 20px;
            width: 100%;
            background: rgba(0, 0, 0, 0.8);
            border-top: 2px solid #00ffff;
            margin-top: 40px;
            font-size: 0.9em;
        }

        /* Портретная ориентация для высоких экранов */
        @media (min-height: 1000px) {
            .links-column {
                gap: 25px;
            }
            
            .link-btn {
                padding: 25px 40px;
                min-height: 70px;
                font-size: 1.3em;
            }
        }

        /* Улучшение читаемости на маленьких экранах */
        @media (max-width: 360px) {
            .link-btn {
                font-size: 1em;
                padding: 14px 20px;
            }
            
            .link-btn::before {
                font-size: 1.2em;
                min-width: 25px;
            }
            
            .nickname {
                font-size: 2em;
            }
        }

        /* Плавная прокрутка */
        html {
            scroll-behavior: smooth;
        }

        /* Убираем выделение на мобильных */
        .link-btn {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Эффект загрузки */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #00ffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
    </div>

    <div class="container">
        <header>
            <h1 class="nickname">Forzes Stream</h1>
            <div class="avatar"></div>
        </header>

        <section class="links-column">
            <a href="https://vk.com/id844636088" class="link-btn vk" target="_blank">VK</a>
            <a href="https://t.me/+ptO8T5KbpPoyNzli" class="link-btn telegram" target="_blank">Telegram</a>
            <a href="https://www.youtube.com/@Forzes-Stream" class="link-btn youtube" target="_blank">YouTube</a>
            <a href="https://discord.gg/rJ6g8wRz" class="link-btn discord" target="_blank">Discord</a>
            <a href="https://donatex.gg/donate/forzesof" class="link-btn donate-btn" target="_blank">Донат</a>
            <a href="https://memealerts.com/655e170357eccc4d2f032b17" class="link-btn memes-btn" target="_blank">Мемы</a>
            <a href="https://forzes12.github.io/ForzSite/" class="link-btn game-site-btn" target="_blank">Мой сайт с играми для Пк</a>
        </section>
    </div>

    <script>
        // Убираем прелоадер
        window.addEventListener('load', function() {
            setTimeout(() => {
                const loading = document.getElementById('loading');
                loading.style.opacity = '0';
                setTimeout(() => {
                    loading.style.display = 'none';
                }, 500);
            }, 500);
        });

        // Адаптивные эффекты
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.link-btn');
            const isMobile = window.innerWidth <= 768;
            
            // Добавляем вибрацию на мобильных
            if (isMobile && 'vibrate' in navigator) {
                buttons.forEach(btn => {
                    btn.addEventListener('touchstart', () => {
                        navigator.vibrate(30);
                    });
                });
            }
            
            // Эффект клика с волной
            buttons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const ripple = document.createElement('span');
                    ripple.style.cssText = `
                        position: absolute;
                        background: rgba(255, 255, 255, 0.3);
                        border-radius: 50%;
                        transform: scale(0);
                        animation: ripple 0.6s linear;
                        pointer-events: none;
                        width: ${isMobile ? '50px' : '100px'};
                        height: ${isMobile ? '50px' : '100px'};
                        top: ${y - (isMobile ? 25 : 50)}px;
                        left: ${x - (isMobile ? 25 : 50)}px;
                        z-index: 0;
                    `;
                    
                    this.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 600);
                    
                    // На мобильных - эффект нажатия
                    if (isMobile) {
                        this.style.transform = 'scale(0.96)';
                        setTimeout(() => {
                            this.style.transform = '';
                        }, 150);
                    }
                });
            });
            
            // Эффект параллакса для ПК
            if (!isMobile) {
                window.addEventListener('mousemove', function(e) {
                    const x = (e.clientX / window.innerWidth - 0.5) * 10;
                    const y = (e.clientY / window.innerHeight - 0.5) * 10;
                    
                    document.querySelector('.avatar').style.transform = 
                        `translate(${x}px, ${y}px) scale(1.05)`;
                });
            }
            
            // Следим за изменением размера окна
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    window.location.reload();
                }, 250);
            });
            
            // Добавляем стили для ripple эффекта
            const style = document.createElement('style');
            style.textContent = `
                @keyframes ripple {
                    to {
                        transform: scale(4);
                        opacity: 0;
                    }
                }
                
                /* Улучшение производительности на мобильных */
                @media (max-width: 768px) {
                    .link-btn {
                        will-change: transform;
                    }
                }
                
                /* Отключаем анимации при уменьшенном движении */
                @media (prefers-reduced-motion: reduce) {
                    * {
                        animation-duration: 0.01ms !important;
                        animation-iteration-count: 1 !important;
                        transition-duration: 0.01ms !important;
                    }
                }
            `;
            document.head.appendChild(style);
        });
        
        // Определяем тип устройства для дополнительных эффектов
        function getDeviceType() {
            const ua = navigator.userAgent;
            if (/mobile|android|iphone|ipad/i.test(ua)) {
                return 'mobile';
            }
            return 'desktop';
        }
        
        // Сохраняем тип устройства в localStorage для оптимизации
        localStorage.setItem('deviceType', getDeviceType());
    </script>
</body>
</html>
