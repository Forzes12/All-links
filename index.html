<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forzes Stream</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

:root {
    --cyan: #00ffff;
    --pink: #ff00ff;
    --purple: #8b00ff;
}

/* ================= ОСНОВА ================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;

    font-family: 'Orbitron', sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(0,255,255,.12),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(255,0,255,.12),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #050509 0%,
            #0b0b18 45%,
            #080812 100%
        );

    background-attachment: fixed;

    display: flex;
    justify-content: center;
    position: relative;
}

/* ================= ЧАСТИЦЫ ================= */

#particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #00ffff;
    box-shadow: 0 0 10px #00ffff;

    animation: particleFloat linear infinite;
}

@keyframes particleFloat {
    from {
        transform: translateY(110vh);
    }

    to {
        transform: translateY(-10vh);
    }
}

/* ================= CONTAINER ================= */

.container {
    width: 100%;
    max-width: 850px;

    padding: 25px 20px 40px;

    position: relative;
    z-index: 2;
}

/* ================= HEADER ================= */

header {
    text-align: center;

    padding: 35px 20px 40px;
    margin-bottom: 35px;

    border: 1px solid rgba(0,255,255,.4);
    border-radius: 30px;

    background: rgba(10,10,25,.75);

    backdrop-filter: blur(18px);

    box-shadow:
        0 0 30px rgba(0,255,255,.1),
        inset 0 0 30px rgba(255,0,255,.04);

    overflow: hidden;
}

.status {
    display: inline-flex;

    align-items: center;
    gap: 8px;

    padding: 7px 14px;
    margin-bottom: 18px;

    border: 1px solid rgba(0,255,255,.35);
    border-radius: 30px;

    color: #9fffff;

    font-size: .7rem;
    letter-spacing: 3px;
}

.status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #00ff66;

    box-shadow: 0 0 12px #00ff66;

    animation: statusPulse 1.4s infinite;
}

@keyframes statusPulse {
    50% {
        transform: scale(.6);
        opacity: .4;
    }
}

.nickname {
    font-size: clamp(2.5rem, 8vw, 5rem);

    font-weight: 900;
    letter-spacing: 4px;

    text-shadow:
        0 0 10px #00ffff,
        0 0 30px #00ffff;

    animation: titleGlow 3s ease-in-out infinite alternate;
}

@keyframes titleGlow {
    from {
        text-shadow:
            0 0 10px #00ffff,
            0 0 25px #00ffff;
    }

    to {
        text-shadow:
            0 0 10px #ff00ff,
            0 0 35px #ff00ff;
    }
}

.subtitle {
    margin-top: 12px;

    color: #77778f;

    font-size: .75rem;
    letter-spacing: 4px;
}

/* ================= АВАТАР ================= */

.avatar-wrapper {
    width: 190px;
    height: 190px;

    margin: 35px auto 0;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
}

.avatar-wrapper::before,
.avatar-wrapper::after {
    content: "";

    position: absolute;

    border-radius: 50%;
    border: 1px solid #00ffff;

    inset: -10px;

    animation: ringRotate 8s linear infinite;
}

.avatar-wrapper::after {
    inset: -18px;

    border-color: #ff00ff;

    animation-direction: reverse;
    animation-duration: 12s;
}

@keyframes ringRotate {
    to {
        transform: rotate(360deg);
    }
}

.avatar {
    width: 175px;
    height: 175px;

    border-radius: 50%;

    background:
        url('assets/32PbU5bsSkOMI561TWeQfg@2k.webp')
        center / cover no-repeat;

    border: 3px solid #00ffff;

    box-shadow:
        0 0 20px #00ffff,
        0 0 45px rgba(0,255,255,.4);

    transition: transform .15s ease;
}

/* ================= КНОПКИ ================= */

.links-column {
    display: flex;
    flex-direction: column;

    gap: 16px;
}

.link-btn {
    position: relative;
    overflow: hidden;

    width: 100%;
    min-height: 68px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;

    padding: 18px 25px;

    color: white;
    text-decoration: none;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 18px;

    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 1px;

    backdrop-filter: blur(12px);

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        filter .3s ease;

    opacity: 0;

    animation: buttonAppear .5s ease forwards;
}

.link-btn:nth-child(1) { animation-delay: .05s; }
.link-btn:nth-child(2) { animation-delay: .10s; }
.link-btn:nth-child(3) { animation-delay: .15s; }
.link-btn:nth-child(4) { animation-delay: .20s; }
.link-btn:nth-child(5) { animation-delay: .25s; }
.link-btn:nth-child(6) { animation-delay: .30s; }
.link-btn:nth-child(7) { animation-delay: .35s; }
.link-btn:nth-child(8) { animation-delay: .40s; }

@keyframes buttonAppear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.icon {
    position: relative;
    z-index: 2;

    font-size: 1.4rem;

    transition:
        transform .4s ease,
        filter .4s ease;
}

.link-btn span:last-child {
    position: relative;
    z-index: 2;
}

/* ================= VK ================= */

.vk {
    background: linear-gradient(
        120deg,
        rgba(76,117,163,.9),
        rgba(76,117,163,.3)
    );

    border-color: #4c75a3;
}

@media (hover:hover) {

    .vk:hover {
        transform: translateX(8px);

        box-shadow:
            0 0 25px rgba(76,117,163,.7),
            inset 0 0 25px rgba(255,255,255,.08);
    }

    .vk:hover .icon {
        transform: rotate(-15deg) scale(1.25);
    }
}

/* ================= TELEGRAM ================= */

.telegram {
    background: linear-gradient(
        120deg,
        rgba(0,136,204,.9),
        rgba(0,136,204,.3)
    );

    border-color: #00aaff;
}

@media (hover:hover) {

    .telegram:hover {
        transform: translateX(8px);

        box-shadow:
            0 0 30px rgba(0,170,255,.7);
    }

    .telegram:hover .icon {
        transform:
            translate(8px,-5px)
            rotate(-15deg)
            scale(1.25);
    }
}

/* ================= YOUTUBE ================= */

.youtube {
    background: linear-gradient(
        120deg,
        rgba(255,0,0,.9),
        rgba(120,0,0,.4)
    );

    border-color: #ff3333;
}

@media (hover:hover) {

    .youtube:hover {
        transform: scale(1.025);

        box-shadow:
            0 0 30px rgba(255,0,0,.75);
    }

    .youtube:hover .icon {
        transform: scale(1.35);

        filter:
            drop-shadow(0 0 10px #ff0000);
    }
}

/* ================= DISCORD ================= */

.discord {
    background: linear-gradient(
        120deg,
        rgba(88,101,242,.9),
        rgba(88,101,242,.35)
    );

    border-color: #7380ff;

    box-shadow:
        0 0 0 rgba(88,101,242,0);
}

/* Неоновая линия */

.discord::after {
    content: "";

    position: absolute;

    top: 0;
    left: -100%;

    width: 70%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );

    transform: skewX(-20deg);

    transition: left .6s ease;

    pointer-events: none;
}

/* Наведение */

@media (hover:hover) {

    .discord:hover {

        transform: translateY(-4px) scale(1.02);

        border-color: #9da7ff;

        box-shadow:
            0 0 15px rgba(88,101,242,.7),
            0 0 35px rgba(88,101,242,.4),
            inset 0 0 20px rgba(255,255,255,.05);

        filter: brightness(1.15);
    }

    /* Свет проходит по кнопке */

    .discord:hover::after {
        left: 130%;
    }

    /* Иконка подпрыгивает */

    .discord:hover .icon {
        animation: discordBounce .55s ease;
    }
}

/* Анимация Discord */

@keyframes discordBounce {

    0% {
        transform: translateY(0) rotate(0) scale(1);
    }

    30% {
        transform: translateY(-7px) rotate(-8deg) scale(1.15);
    }

    55% {
        transform: translateY(2px) rotate(6deg) scale(1.05);
    }

    75% {
        transform: translateY(-3px) rotate(-3deg) scale(1.1);
    }

    100% {
        transform: translateY(0) rotate(0) scale(1);
    }
}

/* ================= ДОНАТ ================= */

.donate-btn {
    background: linear-gradient(
        120deg,
        rgba(255,140,0,.95),
        rgba(255,40,0,.45)
    );

    border-color: #ffae00;
}

@media (hover:hover) {

    .donate-btn:hover {
        transform: translateY(-5px) scale(1.02);

        box-shadow:
            0 0 30px rgba(255,140,0,.8),
            0 10px 35px rgba(255,80,0,.4);
    }

    .donate-btn:hover .icon {
        animation: coinSpin .6s ease;
    }
}

@keyframes coinSpin {

    0% {
        transform: rotateY(0) scale(1);
    }

    50% {
        transform: rotateY(180deg) scale(1.3);
    }

    100% {
        transform: rotateY(360deg) scale(1);
    }

}

/* ================= ПОМОЩЬ ================= */

.help-btn {
    background: linear-gradient(
        120deg,
        rgba(255,0,180,.9),
        rgba(130,0,255,.5)
    );

    border-color: #ff35d0;
}

@media (hover:hover) {

    .help-btn:hover {
        transform: scale(1.025);

        box-shadow:
            0 0 35px rgba(255,0,200,.75);
    }

    .help-btn:hover .icon {
        animation: heartBeat .7s infinite;
    }
}

@keyframes heartBeat {

    0%,100% {
        transform: scale(1);
    }

    25% {
        transform: scale(1.35);
    }

    45% {
        transform: scale(1);
    }

    65% {
        transform: scale(1.25);
    }

}

/* ================= МЕМЫ ================= */

.memes-btn {
    background: linear-gradient(
        120deg,
        rgba(255,0,255,.9),
        rgba(100,0,180,.45)
    );

    border-color: #ff00ff;
}

@media (hover:hover) {

    .memes-btn:hover {
        transform: rotate(-1deg) scale(1.025);

        box-shadow:
            0 0 35px rgba(255,0,255,.75);
    }

    .memes-btn:hover .icon {
        animation: memeSpin .6s ease;
    }
}

@keyframes memeSpin {

    0% {
        transform: rotate(0) scale(1);
    }

    50% {
        transform: rotate(20deg) scale(1.4);
    }

    100% {
        transform: rotate(0) scale(1);
    }

}

/* ================= ИГРЫ ================= */

.game-site-btn {
    background: linear-gradient(
        120deg,
        rgba(0,255,120,.85),
        rgba(0,120,60,.4)
    );

    border-color: #00ff88;

    font-family: 'Press Start 2P', cursive;
    font-size: .75rem;
}

@media (hover:hover) {

    .game-site-btn:hover {
        transform: translateY(-5px);

        box-shadow:
            0 0 35px rgba(0,255,120,.7);

        border-color: #ffffff;
    }

    .game-site-btn:hover .icon {
        animation: gameShake .3s infinite;
    }
}

@keyframes gameShake {

    0%   { transform: translate(0); }
    25%  { transform: translate(-3px,2px); }
    50%  { transform: translate(3px,-2px); }
    75%  { transform: translate(-2px,-1px); }
    100% { transform: translate(0); }

}

/* ================= RIPPLE ================= */

.ripple {
    position: absolute;

    border-radius: 50%;

    background: rgba(255,255,255,.35);

    pointer-events: none;

    transform: scale(0);

    animation: ripple .6s linear;
}

@keyframes ripple {

    to {
        transform: scale(4);
        opacity: 0;
    }

}

/* ================= FOOTER ================= */

footer {
    margin-top: 35px;
    padding: 25px 10px;

    text-align: center;

    color: #55556a;

    font-size: .7rem;
    letter-spacing: 2px;
}

footer strong {
    color: #8888a5;
}

/* ================= ПРЕЛОАДЕР ================= */

#loading {
    position: fixed;
    inset: 0;

    z-index: 9999;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #050509;

    transition: opacity .25s ease;
}

.loader-logo {
    font-size: clamp(2rem,7vw,4rem);

    font-weight: 900;

    text-shadow:
        0 0 10px #00ffff,
        0 0 30px #00ffff;
}

.loader-text {
    margin-top: 12px;

    color: #555;

    font-size: .65rem;
    letter-spacing: 3px;
}

.loader-bar {
    width: 180px;
    height: 2px;

    margin-top: 15px;

    background: rgba(255,255,255,.08);

    overflow: hidden;
}

.loader-progress {
    width: 100%;
    height: 100%;

    background: linear-gradient(
        90deg,
        #00ffff,
        #ff00ff
    );

    animation: loaderProgress .3s linear;
}

@keyframes loaderProgress {

    from {
        width: 0;
    }

    to {
        width: 100%;
    }

}

/* ================= MOBILE ================= */

@media (max-width:600px) {

    .container {
    width: 100%;
    max-width: 850px;

    padding: 25px 20px 40px;

    position: relative;
    z-index: 2;

    background: transparent;
}

    header {
        padding: 25px 15px 35px;
        border-radius: 24px;
    }

    .nickname {
        letter-spacing: 2px;
    }

    .subtitle {
        font-size: .62rem;
        letter-spacing: 2px;
    }

    .avatar-wrapper {
        width: 155px;
        height: 155px;
    }

    .avatar {
        width: 145px;
        height: 145px;
    }

    .link-btn {
        min-height: 62px;
        border-radius: 16px;
        font-size: .9rem;
    }

    .game-site-btn {
        font-size: .58rem;
    }

}

@media (prefers-reduced-motion:reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }

}

</style>
</head>

<body>

<div id="loading">
    <div class="loader-logo">FORZES</div>

    <div class="loader-text">
        SYSTEM READY
    </div>

    <div class="loader-bar">
        <div class="loader-progress"></div>
    </div>
</div>

<div id="particles"></div>

<main class="container">

<header>

    <div class="status">
        <span class="status-dot"></span>
        ONLINE
    </div>

    <h1 class="nickname">
        Forzes Stream
    </h1>

    <p class="subtitle">
        Gaming • Stream • Entertainment
    </p>

    <div class="avatar-wrapper">
        <div class="avatar"></div>
    </div>

</header>

<section>

    <div class="links-column">

        <a
            href="https://vk.com/id844636088"
            class="link-btn vk"
            target="_blank"
            rel="noopener"
        >
            <span class="icon">👤</span>
            <span>VK</span>
        </a>

        <a
            href="https://t.me/+ptO8T5KbpPoyNzli"
            class="link-btn telegram"
            target="_blank"
            rel="noopener"
        >
            <span class="icon">✈️</span>
            <span>Telegram</span>
        </a>

        <a
            href="https://www.youtube.com/@Forzes-Stream"
            class="link-btn youtube"
            target="_blank"
            rel="noopener"
        >
            <span class="icon">▶️</span>
            <span>YouTube</span>
        </a>

        <a
            href="https://discord.gg/rJ6g8wRz"
            class="link-btn discord"
            target="_blank"
            rel="noopener"
        >
            <span class="icon">💬</span>
            <span>Discord</span>
        </a>

        <a
            href="https://donatex.gg/donate/forzesof"
            class="link-btn donate-btn"
            target="_blank"
            rel="noopener"
        >
            <span class="icon">💰</span>
            <span>Донат</span>
        </a>

        <a
            href="https://donatex.gg/donate/forzes_1"
            class="link-btn help-btn"
            target="_blank"
            rel="noopener"
        >
            <span class="icon">❤️</span>
            <span>Донат (Помощь)</span>
        </a>

        <a
            href="https://memealerts.com/655e170357eccc4d2f032b17"
            class="link-btn memes-btn"
            target="_blank"
            rel="noopener"
        >
            <span class="icon">😂</span>
            <span>Мемы</span>
        </a>

        <a
            href="https://forzes12.github.io/ForzSite/"
            class="link-btn game-site-btn"
            target="_blank"
            rel="noopener"
        >
            <span class="icon">🎮</span>
            <span>МОЙ САЙТ С ИГРАМИ ДЛЯ ПК</span>
        </a>

    </div>

</section>

<footer>
    <strong>FORZES STREAM</strong>
    <br><br>
    © 2026 • Все права защищены
</footer>

</main>

<script>

/* ================= БЫСТРАЯ ЗАГРУЗКА ================= */

window.addEventListener("load", () => {

    const loading = document.getElementById("loading");

    setTimeout(() => {

        loading.style.opacity = "0";

        setTimeout(() => {
            loading.remove();
        }, 250);

    }, 300);

});


/* ================= ЧАСТИЦЫ ================= */

const particles = document.getElementById("particles");

for (let i = 0; i < 35; i++) {

    const particle = document.createElement("div");

    particle.className = "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.animationDuration =
        5 + Math.random() * 10 + "s";

    particle.style.animationDelay =
        Math.random() * 8 + "s";

    particle.style.opacity =
        .2 + Math.random() * .6;

    particles.appendChild(particle);
}


/* ================= RIPPLE ================= */

document.querySelectorAll(".link-btn").forEach(button => {

    button.addEventListener("click", function(e) {

        const rect = this.getBoundingClientRect();

        const ripple = document.createElement("span");

        ripple.className = "ripple";

        const size =
            Math.max(rect.width, rect.height);

        ripple.style.width = size + "px";
        ripple.style.height = size + "px";

        ripple.style.left =
            e.clientX - rect.left - size / 2 + "px";

        ripple.style.top =
            e.clientY - rect.top - size / 2 + "px";

        this.appendChild(ripple);

        setTimeout(() => {
            ripple.remove();
        }, 600);

    });

});


/* ================= ВИБРАЦИЯ ================= */

if (
    window.innerWidth <= 768 &&
    "vibrate" in navigator
) {

    document.querySelectorAll(".link-btn").forEach(button => {

        button.addEventListener(
            "touchstart",
            () => navigator.vibrate(20)
        );

    });

}


/* ================= ПАРАЛЛАКС АВАТАРКИ ================= */

if (window.innerWidth > 768) {

    const avatar =
        document.querySelector(".avatar");

    document.addEventListener("mousemove", e => {

        const x =
            (e.clientX / window.innerWidth - .5) * 10;

        const y =
            (e.clientY / window.innerHeight - .5) * 10;

        avatar.style.transform =
            `translate(${x}px, ${y}px)`;

    });

}

</script>

</body>
</html>
